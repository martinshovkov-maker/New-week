<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111114">
<title>Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --h{syntax:"<number>";inherits:true;initial-value:250}
:root{
  --h:250;
  --bg:#111114; --surface:#1b1b20; --text:#f3f2f5; --muted:#8d8b96;
  --c:hsl(var(--h) 85% 70%);
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:--h .6s ease;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:var(--body);background:
  radial-gradient(120% 55% at 50% -8%,hsl(var(--h) 70% 32% / .6),transparent 62%),var(--bg);
  background-attachment:fixed;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.app{max-width:430px;margin:0 auto;min-height:100dvh;padding:16px 18px 130px;display:flex;flex-direction:column}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;padding:6px 2px}
.brand svg{width:20px;height:20px;color:var(--c)}
.date{font-size:14px;color:var(--muted)}

.strip{display:flex;gap:7px;margin-bottom:30px}
.dayb{position:relative;flex:1;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;
  color:hsl(var(--d) 85% 76%);background:hsl(var(--d) 55% 28% / .35);box-shadow:inset 0 0 0 1px hsl(var(--d) 70% 60% / .22);
  transition:background .25s,color .25s,transform .2s}
.dayb:active{transform:scale(.92)}
.dayb.on{background:hsl(var(--d) 90% 70%);color:#141416;box-shadow:0 6px 22px hsl(var(--d) 90% 60% / .45)}
.dayb.today::after{content:"";position:absolute;bottom:-9px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:hsl(var(--d) 90% 75%)}

.hello{margin:0 0 4px;font-size:15px;color:var(--muted)}
.dayname{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(28px,9vw,38px);letter-spacing:-.03em;line-height:1.1;color:var(--c)}
.count{margin:8px 0 0;font-size:15px;color:var(--muted)}

/* home */
.home{display:flex;flex-direction:column;flex:1}
.meme{align-self:center;position:relative;width:min(250px,66vw);aspect-ratio:1;margin:30px 0 34px;border-radius:22px;overflow:hidden;transform:rotate(-2.5deg);
  background:radial-gradient(circle at 50% 30%,#d9cdbf,#8f8173);display:grid;place-items:start center;padding-top:16px;
  box-shadow:0 24px 50px -12px hsl(var(--h) 80% 45% / .55),0 0 0 1px rgba(255,255,255,.08)}
.meme img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:14px}
.avatar{flex:none;width:68px;height:68px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px hsl(var(--h) 85% 70%),0 8px 24px hsl(var(--h) 90% 55% / .4)}
.meme p{position:absolute;left:10px;right:10px;bottom:10px;margin:0;text-align:center;font-weight:600;font-size:19px;line-height:1.08;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill}
.playrow{display:flex;align-items:center;justify-content:center;gap:16px}
.round{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#141416;
  box-shadow:0 0 0 8px hsl(var(--h) 80% 60% / .16),0 10px 30px hsl(var(--h) 90% 55% / .5);transition:transform .15s}
.round:active{transform:scale(.94)}
.round:disabled{opacity:.35;box-shadow:none}
.round svg{width:30px;height:30px;margin-left:3px}
.playrow b{display:block;font-weight:600;font-size:16px}
.playrow span{font-size:14px;color:var(--muted)}

/* day */
.actions{display:flex;gap:10px;margin:24px 0 18px}
.pbtn{flex:1;height:50px;border-radius:999px;background:var(--c);color:#141416;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn:disabled{opacity:.35}
.pbtn svg{width:20px;height:20px}
.abtn{height:50px;padding:0 20px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.abtn svg{width:16px;height:16px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;border-radius:16px;padding:6px 4px 6px 6px;transition:opacity .25s,transform .25s,background .2s}
.row.out{opacity:0;transform:translateX(30px)}
.row.now{background:hsl(var(--h) 60% 40% / .16)}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left}
.cover{position:relative;flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cover .ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.5)}
.row.now .cover .ov{display:grid}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:4px;height:100%;border-radius:2px;background:#fff;transform-origin:bottom;animation:eq 0.9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.eq.paused i{animation-play-state:paused;transform:scaleY(.35)}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.meta{min-width:0}
.meta b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.trash{padding:10px;border-radius:50%;color:#5f5d68}
.trash:active{color:#f77}
.trash svg{width:19px;height:19px;display:block}
.empty{margin:36px 0;text-align:center;color:var(--muted);line-height:1.5}
.empty b{display:block;font-family:var(--display);font-weight:500;font-size:18px;color:var(--text);margin-bottom:8px}

/* mini player */
.mini{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;transform:translateY(140%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.mini.show{transform:none}
.mini-in{pointer-events:auto;width:100%;max-width:406px;border-radius:24px;padding:10px 10px 12px 12px;
  background:hsl(var(--h) 25% 14% / .82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 12px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.mini-top{display:flex;align-items:center;gap:12px}
.mini .cover{width:46px;height:46px;border-radius:11px}
.mini .meta{flex:1}
.mini .meta b{font-size:15px}.mini .meta span{font-size:13px}
.ctl{display:flex;align-items:center}
.ctl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ctl svg{width:22px;height:22px}
.ctl .pp{background:var(--c);color:#141416;margin:0 2px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin:9px 2px 0 0;overflow:hidden}
.bar div{height:100%;width:0;background:var(--c);border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{padding-bottom:190px}
.bar{margin:0}
.barw{padding:9px 2px 7px 0;cursor:pointer}
.mini-bot{display:flex;align-items:center;gap:4px}
.mini-bot button{position:relative;width:36px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.mini-bot button svg{width:19px;height:19px}
.mini-bot button.on{color:var(--c)}
.mini-bot button.one::after{content:"1";position:absolute;right:5px;bottom:2px;font-size:9px;font-weight:700}
.mini-bot span{margin-left:auto;margin-right:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sh-in{width:100%;max-width:406px;background:#1d1d22;border-radius:28px;padding:24px 22px 22px;text-align:center;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
.sh-in h2{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 8px;color:var(--c)}
.sh-in p{margin:0;color:var(--muted);font-size:15px}
.sh-in .pbtn{width:100%;margin-top:20px}
.sh-in .abtn{margin:10px auto 0;justify-content:center}
.avatar.big{width:96px;height:96px;margin:0 auto 14px;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opts .abtn{margin:0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-160%);background:#2a2a30;padding:11px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand" aria-label="Главная">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>week
    </button>
    <div class="date" id="date"></div>
  </header>
  <nav class="strip" id="strip" aria-label="Дни недели"></nav>
  <main id="view" style="flex:1;display:flex;flex-direction:column"></main>
</div>

<div class="mini" id="mini">
  <div class="mini-in">
    <div class="mini-top">
      <div class="cover" id="mCover"></div>
      <div class="meta"><b id="mTitle"></b><span id="mArtist"></span></div>
      <div class="ctl">
        <button id="prev" aria-label="Предыдущий"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button class="pp" id="pp"></button>
        <button id="next" aria-label="Следующий"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
    </div>
    <div class="barw" id="bar"><div class="bar"><div id="prog"></div></div></div>
    <div class="mini-bot"><button id="bShuf" aria-label="Перемешать"></button><button id="bRep" aria-label="Повтор"></button><button id="bSleep" aria-label="Таймер сна"></button><span id="tm"></span></div>
  </div>
</div>
<audio id="au" preload="metadata"></audio>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*,.mp3" multiple hidden>

function kv(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var q=fn(d.transaction("kv",mode).objectStore("kv"));q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function kvGet(k){return kv("readonly",function(s){return s.get(k)})}
function kvSet(k,v){return kv("readwrite",function(s){return s.put(v,k)})}
function kvDel(k){return kv("readwrite",function(s){return s.delete(k)})}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function save(){kvSet("days",days).catch(function(){})}
async function blob(id){return mem[id]||(mem[id]=await kvGet("b:"+id))}

/* helpers */
function fmt(s){s=s|0;return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)}
function plural(n){var a=n%10,b=n%100;return n+(a===1&&b!==11?" трек":(a>=2&&a<=4&&(b<12||b>14))?" трека":" треков")}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function cov(t){if(t.c)return "background:url('"+t.c+"') center/cover";var h=hue(t.t);return "background:radial-gradient(circle at 72% 28%,hsl("+h+" 80% 76%/.55) 0 16%,transparent 17%),linear-gradient(145deg,hsl("+h+" 55% 38%),hsl("+((h+60)%360)+" 55% 12%))"}
function setHue(i){document.documentElement.style.setProperty("--h",HUES[i])}
function toast(t,ms){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);if(ms)toast.h=setTimeout(function(){e.classList.remove("show")},ms)}
function sheet(html){var e=$("sheet");e.innerHTML='<div class="sh"><div class="sh-in">'+html+'</div></div>';e.firstChild.onclick=function(ev){if(ev.target===this)e.innerHTML=""}}
function closeSheet(){$("sheet").innerHTML=""}

/* mp3 tags (ID3v2): title, artist, cover */
function txt(d){var e=d[0],b=d.subarray(1),enc=e===1?"utf-16":e===2?"utf-16be":e===3?"utf-8":"windows-1251";
 if(e===1&&b[0]===0xFE&&b[1]===0xFF)enc="utf-16be";
 return new TextDecoder(enc).decode(b).replace(/\0+$/,"").trim()}
async function pic(d){
 var p=1;while(d[p]&&p<40)p++;p++;
 for(var i=p;i<Math.min(p+400,d.length-4);i++){
  if((d[i]===0xFF&&d[i+1]===0xD8)||(d[i]===0x89&&d[i+1]===0x50&&d[i+2]===0x4E)){
   var bm=await createImageBitmap(new Blob([d.subarray(i)])),c=document.createElement("canvas");c.width=c.height=128;
   var m=Math.min(bm.width,bm.height);c.getContext("2d").drawImage(bm,(bm.width-m)/2,(bm.height-m)/2,m,m,0,0,128,128);
   return c.toDataURL("image/jpeg",.8)}}
 return null}
async function tags(f){
 var r={};
 try{
  var h=new Uint8Array(await f.slice(0,10).arrayBuffer());
  if(String.fromCharCode(h[0],h[1],h[2])!=="ID3")return r;
  var ver=h[3],n=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
  var b=new Uint8Array(await f.slice(10,10+Math.min(n,8e6)).arrayBuffer()),dv=new DataView(b.buffer),p=0;
  while(p+10<=b.length){
   var id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
   var sz=ver===4?((b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7]):dv.getUint32(p+4);
   var d=b.subarray(p+10,p+10+sz);p+=10+sz;
   if(id==="TIT2")r.t=txt(d);else if(id==="TPE1")r.a=txt(d);else if(id==="APIC")r.c=await pic(d);
  }
 }catch(e){}
 return r}
function dur(f){return new Promise(function(res){var a=new Audio(),u=URL.createObjectURL(f),done=function(v){URL.revokeObjectURL(u);res(v)};
 a.preload="metadata";a.onloadedmetadata=function(){done(Math.round(a.duration)||0)};a.onerror=function(){done(0)};setTimeout(function(){done(0)},5000);a.src=u})}

async function add(files){
 var list=Array.from(files),d=view,k=0;
 for(var f of list){
  toast("Добавляю "+(++k)+" из "+list.length+"…",0);
  var tg=await tags(f),nm=f.name.replace(/\.[^.]+$/,""),pr=nm.split(" - ");
  var id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  var tr={id:id,t:tg.t||(pr.length>1?pr.slice(1).join(" - "):nm),a:tg.a||(pr.length>1?pr[0]:"Неизвестный исполнитель"),s:await dur(f),c:tg.c||null};
  mem[id]=f;
  try{await kvSet("b:"+id,f)}catch(e){toast("Не удалось сохранить на устройстве",3000)}
  days[d].push(tr);save();if(view===d)render();
 }
 toast("Добавлено: "+list.length,2200);
}

/* playback */
async function load(day,i,autoplay,pos){
 var tr=days[day][i];if(!tr)return;
 var b=await blob(tr.id);if(!b){toast("Файл не найден в памяти");return}
 cur={day:day,i:i};
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);au.src=url;
 if(pos)au.addEventListener("loadedmetadata",function f(){au.currentTime=pos;au.removeEventListener("loadedmetadata",f)});
 if(autoplay){try{await au.play()}catch(e){}}
 meta();render();
}
function step(d){
 if(!cur)return;var n=days[cur.day].length;if(!n)return;var i=cur.i;
 if(shuf&&n>1&&d>0){do{i=Math.floor(Math.random()*n)}while(i===cur.i)}else i=(i+d+n)%n;
 load(cur.day,i,true);
}
function toggle(){if(!cur)return;au.paused?au.play():au.pause()}
au.onplay=function(){playing=true;render()};
au.onpause=function(){playing=false;render()};
au.onended=function(){
 if(rep===2){au.currentTime=0;au.play();return}
 if(!shuf&&rep===0&&cur.i===days[cur.day].length-1){au.currentTime=0;return}
 step(1);
};
au.ontimeupdate=function(){
 var d=au.duration||0;$("prog").style.width=(d?au.currentTime/d*100:0)+"%";
 $("tm").textContent=fmt(au.currentTime)+" / "+fmt(d);
 if(cur&&Date.now()-lastSave>2000){lastSave=Date.now();ls("w-r",{day:cur.day,i:cur.i,pos:au.currentTime})}
};
function meta(){
 if(!("mediaSession" in navigator)||!cur)return;var t=days[cur.day][cur.i];if(!t)return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:"Week · "+NOM[cur.day],artwork:t.c?[{src:t.c,sizes:"128x128",type:"image/jpeg"}]:[]})}catch(e){}
}
try{var ms=navigator.mediaSession;
 ms.setActionHandler("play",function(){au.play()});ms.setActionHandler("pause",function(){au.pause()});
 ms.setActionHandler("previoustrack",function(){step(-1)});ms.setActionHandler("nexttrack",function(){step(1)});
 ms.setActionHandler("seekto",function(e){au.currentTime=e.seekTime})}catch(e){}

/* render */
function renderStrip(){
 var b=$("strip");b.innerHTML="";
 SHORT.forEach(function(n,i){
  var x=document.createElement("button");
  x.className="dayb"+(!home&&view===i?" on":"")+(i===TODAY?" today":"");
  x.style.setProperty("--d",HUES[i]);x.textContent=n;x.setAttribute("aria-label",NOM[i]);
  x.onclick=function(){home=false;view=i;render()};b.appendChild(x);
 });
}
function renderHome(){
 var n=days[TODAY].length;
 $("view").innerHTML='<div class="home"><p class="hello">Сегодня</p><h1 class="dayname">'+NOM[TODAY]+'</h1>'+
  '<div class="meme"><img alt="" src="'+CATS[TODAY].s+'" style="object-position:'+CATS[TODAY].p+'"><p></p></div>'+
  '<div class="playrow"><button class="round" id="bigPlay" aria-label="Включить плейлист">'+I.play+'</button>'+
  '<div><b>'+(n?'Включить плейлист':'Пока пусто')+'</b><span>'+(n?plural(n):'Выбери день и добавь музыку')+'</span></div></div></div>';
 $("view").querySelector(".meme p").textContent=CAPS[TODAY];
 var bp=$("bigPlay");bp.disabled=!n;bp.onclick=function(){load(TODAY,0,true)};
}
function renderDay(){
 var list=days[view],n=list.length,tot=list.reduce(function(a,x){return a+(x.s||0)},0);
 $("view").innerHTML='<div><div class="dayhead"><div><h1 class="dayname">'+NOM[view]+'</h1><p class="count">'+(n?plural(n)+(tot?" · "+Math.round(tot/60)+" мин":""):"Пока пусто")+'</p></div><img class="avatar" alt="" src="'+CATS[view].s+'" style="object-position:'+CATS[view].p+'"></div>'+
  '<div class="actions"><button class="pbtn" id="pAll"'+(n?'':' disabled')+'>'+I.play+'Слушать</button><button class="abtn" id="add">'+I.plus+'Добавить</button></div><ul class="list" id="list"></ul></div>';
 $("add").onclick=function(){$("file").click()};
 $("pAll").onclick=function(){load(view,shuf?Math.floor(Math.random()*n):0,true)};
 var ul=$("list");
 if(!n){ul.outerHTML='<div class="empty"><b>Здесь тишина</b>Нажми «Добавить» и выбери mp3<br>с телефона.</div>';return}
 list.forEach(function(tr,i){
  var li=document.createElement("li"),now=cur&&cur.day===view&&cur.i===i;
  li.className="row"+(now?" now":"");
  var p=document.createElement("button");p.className="pick";
  p.innerHTML='<div class="cover" style="'+cov(tr)+'"><div class="ov"><div class="eq'+(playing?'':' paused')+'"><i></i><i></i><i></i></div></div></div><div class="meta"><b></b><span></span></div>';
  p.querySelector("b").textContent=tr.t;p.querySelector("span").textContent=tr.a;
  p.onclick=function(){now?toggle():load(view,i,true)};
  var d=document.createElement("span");d.className="dur";d.textContent=tr.s?fmt(tr.s):"";
  var x=document.createElement("button");x.className="trash";x.setAttribute("aria-label","Удалить");x.innerHTML=I.trash;
  x.onclick=function(){li.classList.add("out");setTimeout(async function(){
   if(cur&&cur.day===view){if(cur.i===i){au.pause();au.removeAttribute("src");cur=null;ls("w-r",null)}else if(cur.i>i)cur.i--}
   var t=days[view].splice(i,1)[0];delete mem[t.id];try{await kvDel("b:"+t.id)}catch(e){}save();render()},250)};
  li.appendChild(p);li.appendChild(d);li.appendChild(x);ul.appendChild(li);
 });
}
function renderMini(){
 var m=$("mini"),t=cur&&days[cur.day][cur.i];
 if(!t){m.classList.remove("show");return}
 m.classList.add("show");
 $("mTitle").textContent=t.t;$("mArtist").textContent=t.a;$("mCover").setAttribute("style",cov(t));
 $("pp").innerHTML=playing?I.pause:I.play;$("pp").setAttribute("aria-label",playing?"Пауза":"Играть");
 $("bShuf").className=shuf?"on":"";$("bRep").className=rep?"on"+(rep===2?" one":""):"";$("bSleep").className=sleepT?"on":"";
}
function render(){setHue(home?TODAY:view);renderStrip();home?renderHome():renderDay();renderMini()}

/* controls */
$("brand").onclick=function(){home=true;render()};
$("pp").onclick=toggle;
$("prev").onclick=function(){if(au.currentTime>3)au.currentTime=0;else step(-1)};
$("next").onclick=function(){step(1)};
$("bShuf").innerHTML=I.shuf;$("bRep").innerHTML=I.rep;$("bSleep").innerHTML=I.moon;
$("bShuf").onclick=function(){shuf=!shuf;ls("w-p",{shuf:shuf,rep:rep});renderMini();toast(shuf?"Перемешивание включено":"Перемешивание выключено",1500)};
$("bRep").onclick=function(){rep=(rep+1)%3;ls("w-p",{shuf:shuf,rep:rep});renderMini();toast(["Повтор выключен","Повтор плейлиста","Повтор трека"][rep],1500)};
$("bSleep").onclick=function(){
 sheet('<h2>Таймер сна</h2><p>Музыка выключится сама</p><div class="opts"><button class="abtn" data-m="15">15 мин</button><button class="abtn" data-m="30">30 мин</button><button class="abtn" data-m="60">1 час</button><button class="abtn" data-m="0">'+(sleepT?"Отключить":"Отмена")+'</button></div>');
 Array.prototype.forEach.call(document.querySelectorAll(".opts .abtn"),function(b){b.onclick=function(){
  var m=+b.dataset.m;clearTimeout(sleepT);sleepT=null;
  if(m){sleepT=setTimeout(function(){au.pause();sleepT=null;renderMini();toast("Таймер сна: музыка выключена",3000)},m*60000);toast("Выключу через "+m+" мин",2000)}
  closeSheet();renderMini()}});
};
$("bar").onclick=function(e){var r=this.getBoundingClientRect();if(au.duration)au.currentTime=(e.clientX-r.left)/r.width*au.duration};
$("file").onchange=function(e){var f=e.target.files;if(f.length)add(f);e.target.value=""};
$("date").textContent=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"});

var tx=0,ty=0;
$("view").addEventListener("touchstart",function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$("view").addEventListener("touchend",function(e){
 if(home)return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>70&&Math.abs(dx)>1.6*Math.abs(dy)){var n=view+(dx<0?1:-1);if(n>=0&&n<7){view=n;render()}}
},{passive:true});

/* start */
(async function(){
 var p=ls("w-p");if(p){shuf=!!p.shuf;rep=p.rep|0}
 try{var d=await kvGet("days");if(d&&d.length===7)days=d}catch(e){toast("Хранилище недоступно: музыка не сохранится",4000)}
 render();
 var r=ls("w-r");if(r&&days[r.day]&&days[r.day][r.i])await load(r.day,r.i,false,r.pos);
 var n=days[TODAY].length;
 if(n){
  sheet('<img class="avatar big" alt="" src="'+CATS[TODAY].s+'" style="object-position:'+CATS[TODAY].p+'"><h2>Сегодня '+NOM[TODAY].toLowerCase()+'</h2><p>'+plural(n)+' ждут тебя. Включить плейлист?</p><button class="pbtn" id="sY">'+I.play+'Включить</button><button class="abtn" id="sN">Позже</button>');
  $("sY").onclick=function(){closeSheet();load(TODAY,0,true)};$("sN").onclick=closeSheet;
 }
})();
</script>
</body>
</html>
